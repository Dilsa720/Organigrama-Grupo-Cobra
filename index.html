const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=name=>name==='Nombre por confirmar'?'?':name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const persons=new Map();let lastFocus=null;let currentPerson=null;let showingProfile=false;
function register(person,department,supervisor,profileKey){const id='p'+persons.size;persons.set(id,{...person,department,supervisor,profileKey});return id}
function avatar(p){return `<span class="avatar" aria-hidden="true">${p.photoUrl?`<img src="${esc(p.photoUrl)}" alt="" loading="lazy" onerror="this.remove()">`:esc(initials(p.name))}</span>`}
function personCard(p,department,supervisor,profileKey){const id=register(p,department,supervisor,profileKey);return `<button type="button" class="person" data-person="${id}" data-search="${esc((p.name+' '+p.role+' '+department).toLowerCase())}">${avatar(p)}<span class="min-w-0"><span class="block font-semibold leading-snug text-sm">${esc(p.role)}</span><span class="block text-sm mt-1 text-slate-300 person-name">${esc(p.name)}</span></span></button>`}
function render(){const managers=$('#management'),leaders=$('#leaders'),teams=$('#teams');managers.innerHTML=org.management.map(g=>`<div class="chief tree-node"><button type="button" class="main-node w-full cursor-pointer" data-manager="${esc(g.id)}"><div class="text-lg sm:text-xl font-extrabold">${esc(g.title)}</div><div class="mt-1 text-sm text-blue-100">${esc(g.scope)}</div></button></div>`).join('');
leaders.innerHTML=org.departments.map(d=>`<div class="tree-node"><button class="leader w-full" data-person="${register(d.leader,d.name,d.management,{'ops':'leader-ops','liq':'leader-liq','sales':'leader-sales','pricing':'leader-pricing'}[d.id])}">${avatar(d.leader)}<span class="min-w-0"><span class="font-bold text-sm sm:text-base block">${esc(d.leader.role)}</span><span class="text-sm block text-blue-100 mt-1">${esc(d.leader.name)}</span></span></button></div>`).join('');
teams.innerHTML=org.departments.map(d=>`<section class="team tree-node team-card" data-department="${esc(d.id)}"><h3 class="team-head">Equipo de ${esc(d.name)}</h3><div class="team-list">${d.members.map(m=>personCard(m,d.name,d.leader.name,{'ops':'operations','liq':'liquidations','sales':'sales','pricing':'pricing'}[d.id])).join('')}<p class="empty" hidden>No hay coincidencias.</p></div></section>`).join('');
$('#support').innerHTML=`<h3 class="services-title">Servicios de Apoyo</h3><div class="services-body"><div>${personCard(org.support[0],'Servicios de Apoyo',profiles.transport.reportsTo,'transport')}</div><div class="grid gap-2">${org.support.slice(1).map(p=>personCard(p,'Servicios de Apoyo',profiles.messenger.reportsTo,'messenger')).join('')}</div></div>`;
}
const profileBox=(label,html)=>`<section class="profile-section"><h3 class="font-semibold text-blue-200 mb-2">${esc(label)}</h3>${html}</section>`;
const profileList=items=>`<ul class="list-disc pl-5 space-y-1.5 text-sm leading-relaxed">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function detail(id){const p=persons.get(id);if(!p)return;lastFocus=document.activeElement;currentPerson=p;showingProfile=false;$('#detailTitle').textContent=p.role;$('#detailBody').innerHTML=`<div class="flex items-center gap-4 mb-5">${avatar(p)}<div><p class="font-bold text-lg">${esc(p.name)}</p><p class="text-sm opacity-70">${esc(p.department)}</p></div></div><div class="space-y-3 text-sm"><div class="rounded-xl border border-slate-600/60 p-3"><span class="block opacity-70 mb-1">Cargo</span><strong>${esc(p.role)}</strong></div><div class="rounded-xl border border-slate-600/60 p-3"><span class="block opacity-70 mb-1">Área</span><strong>${esc(p.department)}</strong></div><div class="rounded-xl border border-slate-600/60 p-3"><span class="block opacity-70 mb-1">A quién reporta</span><strong>${esc(profiles[p.profileKey]?.reportsTo||p.supervisor)}</strong></div></div><button type="button" id="showProfile" class="w-full mt-5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-3">📋 Descripción del puesto →</button>`;$('#modal').hidden=false;document.body.style.overflow='hidden';$('#close').focus()}
function showProfile(){if(!currentPerson||!profiles[currentPerson.profileKey])return;const p=currentPerson, pr=profiles[p.profileKey];showingProfile=true;$('#detailTitle').textContent='Descripción del puesto';$('#detailBody').innerHTML=`<div class="flex items-center gap-3 mb-4">${avatar(p)}<div><p class="font-bold">${esc(p.role)}</p><p class="text-sm opacity-70">${esc(p.name)}</p></div></div><div class="profile-section"><div class="text-xs uppercase tracking-wide opacity-70 mb-1">A quién reporta</div><div class="font-bold text-lg">${esc(pr.reportsTo)}</div>${['transport','messenger'].includes(p.profileKey)?'<p class="text-xs text-amber-300 mt-2">Línea de reporte formal pendiente de validación según el manual.</p>':''}</div>${profileBox('Propósito del puesto',`<p class="text-sm leading-relaxed">${esc(pr.purpose)}</p>`)}${profileBox('Responsabilidades principales',profileList(pr.responsibilities))}${profileBox('Formación académica',profileList(pr.education))}${profileBox('Experiencia requerida',profileList(pr.experience))}${profileBox('Conocimientos técnicos',profileList(pr.knowledge))}${profileBox('Competencias',profileList(pr.competencies))}${profileBox('Nivel de autoridad / decisiones',profileList(pr.authority))}${profileBox('Indicadores sugeridos',profileList(pr.kpis))}<div class="text-xs opacity-60 mt-4">Perfil preliminar · Sujeto a validación organizacional</div><button type="button" id="backPerson" class="mt-5 w-full theme-button">← Volver a la ficha</button>`;$('#modal').querySelector('.modal-panel').scrollTop=0;$('#backPerson').focus()}
function detailManager(id){const m=org.management.find(x=>x.id===id);if(!m)return;lastFocus=document.activeElement;currentPerson=null;$('#detailTitle').textContent=m.title;$('#detailBody').innerHTML=`<p class="mb-4">${esc(m.scope)}</p><div class="profile-section text-sm">Este nivel gerencial se muestra para representar la estructura jerárquica. El manual adjunto no incluye una descripción formal de este puesto.</div>`;$('#modal').hidden=false;document.body.style.overflow='hidden';$('#close').focus()}
function closeDetail(){$('#modal').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
render();
document.addEventListener('click',e=>{const card=e.target.closest('[data-person]');if(card)detail(card.dataset.person);const manager=e.target.closest('[data-manager]');if(manager)detailManager(manager.dataset.manager);if(e.target.closest('#showProfile'))showProfile();if(e.target.closest('#backPerson')&&currentPerson){const id=[...persons].find(([,p])=>p===currentPerson)?.[0];if(id)detail(id)}});
$('#close').addEventListener('click',closeDetail);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeDetail()});
$('#theme').addEventListener('click',()=>{const light=document.body.classList.toggle('light');$('#theme').textContent=light?'🌙 Tema oscuro':'☀️ Tema claro';$('#search').classList.toggle('bg-white',light);$('#search').classList.toggle('text-slate-900',light)});
$('#print').addEventListener('click',()=>window.print());
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLocaleLowerCase('es');document.querySelectorAll('.person').forEach(el=>{el.classList.toggle('hidden-person',!!q&&!el.dataset.search.includes(q))});document.querySelectorAll('.team').forEach(el=>{const none=!el.querySelector('.person:not(.hidden-person)');el.querySelector('.empty').hidden=!none});document.querySelectorAll('.leader').forEach((el,i)=>{const d=org.departments[i];el.style.opacity=!q||`${d.leader.name} ${d.leader.role} ${d.name}`.toLocaleLowerCase('es').includes(q)?'1':'.55'})});
</script>
</body>
</html>
